            display: block;
            height: 4px;

<script>
    const VOTE_LABELS = {pro: 'Pro', con: 'Con', abs: 'Abstain'};

    async function loadData() {
        try {
            const response = await fetch('./data.json');
            if (response.ok) return await response.json();
        } catch {
            // fetch block on file://
        }
        return JSON.parse(document.getElementById('inline-data').textContent);
    }

    function render(data) {
        const total = data.votes.length;

        const rows = Object.entries(VOTE_LABELS).map(([key, label]) => ({
            label,
            count: data.votes.filter(v => v.vote === key).length
        }));

        const highCount = Math.max(...rows.map(row => row.count));

        document.getElementById('title').textContent = data.title;
        document.getElementById('topic').textContent = data.topic;
        document.getElementById('total').textContent = total;

        document.getElementById('results').innerHTML = rows.map(row => {
           const share = (row.count / total) * 100;
           const isMajority = row.count === highCount;

           return `
            <tr ${isMajority ? 'class="majority"' : ''}>
                <td>${row.label}</td>
                <td>${row.count}</td>
                <td>
                    ${share.toFixed(1)}%
                    <span class="bar" style="width: ${share}%"></span>
                </td>
            </tr>
           `
        }).join('');
    }

    loadData().then(render);
</script>
