<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A3: Holygrail Layout (Level 01)</title>
    <link rel="stylesheet" href="./bootstrap.min.css">
    <style>
        body {
            color: white;
            font-size: 2rem;
            font-family: "Times New Roman";
        }

        header, footer {
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        aside, main {
            display: flex;
            justify-content: center;
            padding: 1.5rem;
            height: 500px;
        }

        header {
            background: #fd4400;
        }
        footer {
            background: #fd1494;
        }
        aside.left {
            background: #1e90fc;
        }
        main {
            background: #473d8a;
        }
        aside.right {
            background: #228a22;
        }

        @media screen and (width <= 768px) {
            main {
                height: 300px;
            }
            aside {
                height: 125px;
            }
        }
    </style>
</head>
<body>
<div class="container vstack">
    <header>HEADER</header>
    <div class="row g-0">
        <div class="col-md-3 col-12 order-md-1 order-2">
            <aside class="left">LEFT SIDEBAR</aside>
        </div>
        <div class="col-md-6 col-12 order-md-2 order-1">
            <main>MAIN CONTENT</main>
        </div>
        <div class="col-md-3 col-12 order-md-3 order-3">
            <aside class="right">RIGHT SIDEBAR</aside>
        </div>
    </div>
    <footer>FOOTER</footer>
</div>
</body>
</html>
